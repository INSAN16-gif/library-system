<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Details</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Book Details</h1>
    <div class="nav-links"><a href="index.html">Back</a></div>
    <div id="detailArea"></div>
  </div>

  <script src="storage.js"></script>
  <script>
    const id = Number(new URLSearchParams(location.search).get("id"));
    const record = Number.isInteger(id) && id > 0 ? getRecordById(id) : null;
    const detailArea = document.getElementById("detailArea");

    if (!record) {
      detailArea.innerHTML = '<p class="muted">Record not found.</p>';
    } else {
      detailArea.innerHTML = `
        <div class="detail-card">
          <p><strong>ID:</strong> ${record.id}</p>
          <p><strong>Title:</strong> <span id="vTitle"></span></p>
          <p><strong>Author:</strong> <span id="vAuthor"></span></p>
          <p><strong>Category:</strong> <span id="vCategory"></span></p>
          <p><strong>Copies:</strong> ${record.copies}</p>
        </div>
      `;
      document.getElementById("vTitle").textContent = record.title;
      document.getElementById("vAuthor").textContent = record.author;
      document.getElementById("vCategory").textContent = record.category;
    }
  </script>
</body>
</html>
