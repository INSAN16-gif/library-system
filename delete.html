<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete Book</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Delete Book</h1>
    <div id="confirmArea"></div>
  </div>

  <script src="storage.js"></script>
  <script>
    const id = Number(new URLSearchParams(location.search).get("id"));
    const record = Number.isInteger(id) && id > 0 ? getRecordById(id) : null;
    const confirmArea = document.getElementById("confirmArea");

    if (!record) {
      confirmArea.innerHTML = '<p class="muted">Record not found.</p><div class="nav-links"><a href="index.html">Back</a></div>';
    } else {
      confirmArea.innerHTML = `
        <div class="detail-card">
          <p>Are you sure you want to delete this book?</p>
          <p><strong>Title:</strong> <span id="dTitle"></span></p>
          <p><strong>Author:</strong> <span id="dAuthor"></span></p>
          <div class="nav-links">
            <button type="button" id="confirmBtn">Confirm Delete</button>
            <a href="index.html">Cancel</a>
          </div>
        </div>
      `;
      document.getElementById("dTitle").textContent = record.title;
      document.getElementById("dAuthor").textContent = record.author;
      document.getElementById("confirmBtn").addEventListener("click", () => {
        deleteRecord(record.id);
        window.location.href = "index.html";
      });
    }
  </script>
</body>
</html>
