<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Book</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Edit Book</h1>
    <div class="nav-links"><a href="index.html">Back</a></div>
    <div id="errors"></div>
    <div id="formArea"></div>
  </div>

  <script src="storage.js"></script>
  <script>
    const id = Number(new URLSearchParams(location.search).get("id"));
    const record = Number.isInteger(id) && id > 0 ? getRecordById(id) : null;
    const formArea = document.getElementById("formArea");

    if (!record) {
      formArea.innerHTML = '<p class="muted">Record not found.</p>';
    } else {
      formArea.innerHTML = `
        <form id="editForm">
          <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" maxlength="150" required>
          </div>
          <div class="form-group">
            <label for="author">Author</label>
            <input type="text" id="author" maxlength="100" required>
          </div>
          <div class="form-group">
            <label for="category">Category</label>
            <input type="text" id="category" maxlength="50" required>
          </div>
          <div class="form-group">
            <label for="copies">Copies</label>
            <input type="number" id="copies" min="0" step="1" required>
          </div>
          <button type="submit">Update Book</button>
        </form>
      `;

      document.getElementById("title").value = record.title;
      document.getElementById("author").value = record.author;
      document.getElementById("category").value = record.category;
      document.getElementById("copies").value = record.copies;

      document.getElementById("editForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const title = document.getElementById("title").value.trim();
        const author = document.getElementById("author").value.trim();
        const category = document.getElementById("category").value.trim();
        const copiesRaw = document.getElementById("copies").value.trim();
        const errors = [];

        if (!title || title.length > 150) errors.push("Title is required (max 150 characters).");
        if (!author || author.length > 100) errors.push("Author is required (max 100 characters).");
        if (!category || category.length > 50) errors.push("Category is required (max 50 characters).");
        if (!/^\d+$/.test(copiesRaw) || Number(copiesRaw) < 0) errors.push("Copies must be a whole number 0 or greater.");

        if (errors.length) {
          document.getElementById("errors").innerHTML =
            '<div class="error-box"><ul>' + errors.map(err => `<li>${err}</li>`).join("") + "</ul></div>";
          return;
        }

        updateRecord(record.id, { title, author, category, copies: Number(copiesRaw) });
        window.location.href = "index.html";
      });
    }
  </script>
</body>
</html>
